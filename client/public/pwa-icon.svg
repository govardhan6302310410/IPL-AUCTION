<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141d33" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd055" />
      <stop offset="50%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" />

  <!-- Outer circular ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="16 8" opacity="0.4" />
  
  <!-- Main inner shield -->
  <circle cx="256" cy="256" r="155" fill="#0d1424" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Cricket Seam / Auction Gavel Motif -->
  <!-- Cricket Ball Seams -->
  <path d="M190 120 C 140 180, 140 330, 190 392" fill="none" stroke="#f5a623" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  <path d="M322 120 C 372 180, 372 330, 322 392" fill="none" stroke="#f5a623" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Stylized Gavel / Bat Icon Center -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Gavel head -->
    <rect x="226" y="160" width="60" height="110" rx="12" fill="url(#goldGrad)" stroke="#fff" stroke-width="2" />
    <rect x="216" y="152" width="80" height="16" rx="6" fill="#ffd055" />
    <rect x="216" y="262" width="80" height="16" rx="6" fill="#ffd055" />
    <!-- Gavel handle -->
    <rect x="246" y="270" width="20" height="110" rx="6" fill="url(#goldGrad)" />
  </g>

  <!-- Typography IPL -->
  <text x="256" y="385" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">IPL MEGA</text>
  <text x="256" y="415" text-anchor="middle" fill="#f5a623" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="6">AUCTION</text>
</svg>
